# Sample Nginx Configuration for Video Noise Remover
# Save this in /etc/nginx/sites-available/yourdomain.com
# and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Redirect all HTTP requests to HTTPS (requires SSL cert, e.g. Certbot)
    # return 301 https://$host$request_uri;

    # --- The below should be in your listen 443 (HTTPS) block ---

    # Allow large video uploads up to 500MB
    client_max_body_size 500M;

    # Optional: Increase timeouts since video uploading and processing can take time
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;

    location / {
        # Forward requests to your internal Waitress or Gunicorn server
        proxy_pass http://127.0.0.1:5000;
        
        # Pass necessary headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static files directly via Nginx (faster than letting Flask do it)
    location /static/ {
        alias /path/to/your/project/video background noice remover/static/;
        expires 30d;
        access_log off;
    }

    # Optional: Serve processed videos directly to bypass Flask entirely
    # location /processed/ {
    #     alias /path/to/your/project/video background noice remover/processed/;
    #     # Add Content-Disposition header if you want to force download
    #     add_header Content-Disposition 'attachment';
    # }
}
